<!DOCTYPE html>
<html lang = "en">

<head>
    <title>
        All Cats
    </title>
    <meta charset = "utf-8">
    <link href = "index.css" rel = "stylesheet">
    <script src = "script.js"></script>
</head>

<body onload = "loadCats()">
<div class = "pinkbar">
    <img src = "logo.png" class = "logo" width = "100" height = "100">

    <header>
        <h1>Official Cat Database</h1>
    </header>
</div>

<div class = "topnav">
    <a href = "index.html">Home Page</a>
    <a href = "upload.html">Upload Cats</a>
    <a href = "allcats.html">All Cats</a>
</div>

<div class = "theme-toggle">
    <button id = "themeButton" onclick = "toggleDarkMode()">🌙 Dark Mode</button>
</div>

<main>
<div class = "textcenter">
    <h2>All Cats</h2>
    <div id = "catList" class = "cat-container"></div>
</div>
</main>

<footer>
    Copyright &copy; 2026 Brianna Zaffina & Rasha Boura
</footer>


<script>
function updateThemeButton()
{
    const button = document.getElementById("themeButton");

    if(document.body.classList.contains("dark-mode"))
    {
        button.innerHTML = "☀️ Light Mode";
    }
    else
    {
        button.innerHTML = "🌙 Dark Mode";
    }
}

function toggleDarkMode()
{
    document.body.classList.toggle("dark-mode");

    if(document.body.classList.contains("dark-mode"))
    {
        localStorage.setItem("theme", "dark");
    }
    else
    {
        localStorage.setItem("theme", "light");
    }

    updateThemeButton();
}

window.addEventListener("DOMContentLoaded", function()
{
    if(localStorage.getItem("theme") === "dark")
    {
        document.body.classList.add("dark-mode");
    }

    updateThemeButton();
});
</script>

</body>
</html>
